<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lords Mobile Bot</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#22304d;--text:#dde6f5;--muted:#8696b3;--ok:#34d399;--warn:#fbbf24}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
main{max-width:900px;margin:auto}
h1{margin:0 0 16px}
h2{margin:0 0 12px;font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.ok{color:var(--ok)}
.warn{color:var(--warn)}
</style>
</head>
<body>
<main>
  <h1>Lords Mobile Bot</h1>
  <div class="card">
    <h2>Bots <span class="muted" id="summary"></span></h2>
    <table>
      <thead><tr><th>Name</th><th>Status</th></tr></thead>
      <tbody id="bots"><tr><td colspan="2" class="muted">Loading...</td></tr></tbody>
    </table>
  </div>
  <p class="muted" id="updated"></p>
</main>
<script>
const $ = id => document.getElementById(id);

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function td(text, cls) {
  const e = document.createElement('td');
  e.textContent = text;
  if (cls) e.className = cls;
  return e;
}

async function refresh() {
  try {
    const { bots } = await api('/api/status');
    const rows = bots.map(b => {
      const tr = document.createElement('tr');
      tr.append(td(b.name), td(b.state, b.online ? 'ok' : 'warn'));
      return tr;
    });
    $('bots').replaceChildren(...rows);
    $('summary').textContent = `(${bots.filter(b => b.online).length}/${bots.length} online)`;
    $('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    $('updated').textContent = 'Connection error: ' + e.message;
  }
  setTimeout(refresh, 3000);
}

refresh();
</script>
</body>
</html>
